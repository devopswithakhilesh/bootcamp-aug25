---
# playbook to run webapp on ec2 with ansible

- hosts:
    webservers

  connection: ssh

  vars:
    ansible_user: ec2-user
    ansible_ssh_private_key_file: ../ansible.pem

  become: true

  tasks:
    - name: install nginx
      yum:
        name: nginx
        state: present

    - name: copy index.html to /usr/share/nginx/html
      copy:
        src: index.html
        dest: /usr/share/nginx/html/index.html

    - name: start nginx
      service:
        name: nginx
        state: started
        enabled: true